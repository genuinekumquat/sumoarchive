# =====================================================
# SUMOARCHIVE Production Environment Configuration
# 활성화: java -jar app.jar --spring.profiles.active=prod
# 또는 환경변수: SPRING_PROFILES_ACTIVE=prod
# =====================================================

# 1. 서버 포트 (Cloud 플랫폼의 PORT 환경변수 지원, 기본값 8080)
server.port=${PORT:8080}

# 2. Database Connection (운영 MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sumo?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP 운영 커넥션 풀 최적화
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.idle-timeout=300000

# 3. JPA / Hibernate 설정
# 운영 환경에서는 절대 테이블 구조를 자동 수정(update)하지 않고 엔티티와 DB 일치 여부만 검증(validate)합니다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 4. Thymeleaf 템플릿 캐시
# 운영 환경에서는 매 요청마다 HTML을 새로 파싱하지 않고 캐싱하여 CPU/메모리 부하를 줄이고 응답 속도를 극대화합니다.
spring.thymeleaf.cache=true

# 5. 관리자 계정 시크릿 (환경변수로 주입)
admin.username=${ADMIN_USERNAME:torikumiAdmin}
admin.password=${ADMIN_PASSWORD}

# 6. 로깅 설정 (불필요한 디버그 로그 차단)
logging.level.root=INFO
logging.level.com.torikumilab.sumoarchive=INFO
logging.level.org.hibernate.SQL=WARN
