<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{main.title}">스모아카이브 | 반즈케</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Noto+Serif+KR:wght@400;600;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sumi: #1a1a18;
            --sumi-soft: #56554e;
            --sumi-faint: #86857f;
            --washi: #f7f6f3;
            --washi-panel: #eceae4;
            --washi-line: rgba(26, 26, 24, 0.14);
            --shu: #a3272c;
            --shu-deep: #7c1d20;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: var(--washi);
            background-image:
                repeating-linear-gradient(90deg, rgba(26,26,24,0.022) 0px, rgba(26,26,24,0.022) 1px, transparent 1px, transparent 3px),
                repeating-linear-gradient(0deg, rgba(26,26,24,0.012) 0px, rgba(26,26,24,0.012) 1px, transparent 1px, transparent 5px);
            color: var(--sumi);
            font-family: 'Noto Serif KR', serif;
            line-height: 1.6;
            min-height: 100vh;
        }

        .page {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        /* ===== Header ===== */
        header {
            position: relative;
            border: 3px double var(--sumi);
            padding: 28px 28px 22px;
            margin-bottom: 36px;
        }

        .seal {
            position: absolute;
            top: -18px;
            right: 22px;
            width: 58px;
            height: 58px;
            background: var(--shu);
            color: var(--washi);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Yuji Syuku', serif;
            font-size: 26px;
            letter-spacing: -2px;
            transform: rotate(-4deg);
            box-shadow: 0 2px 3px rgba(0,0,0,0.3), inset 0 0 0 2px rgba(247,246,243,0.5);
        }

        .brand-row {
            display: flex;
            align-items: baseline;
            gap: 14px;
            flex-wrap: wrap;
        }

        .brand-jp {
            font-family: 'Yuji Syuku', serif;
            font-size: 40px;
            letter-spacing: 4px;
            color: var(--sumi);
            text-decoration: none;
        }

        .brand-kr {
            font-family: 'Noto Serif KR', serif;
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 1px;
            color: var(--sumi-soft);
        }

        .brand-sub {
            margin-top: 6px;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--sumi-faint);
        }

        /* ===== Search ===== */
        .search-wrap {
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px solid var(--washi-line);
            display: flex;
            gap: 10px;
        }

        .search-wrap input[type="text"] {
            flex: 1;
            border: 1px solid var(--sumi);
            background: rgba(255,255,255,0.55);
            padding: 12px 14px;
            font-family: 'Noto Serif KR', serif;
            font-size: 15px;
            color: var(--sumi);
        }

        .search-wrap input[type="text"]::placeholder { color: var(--sumi-faint); }

        .search-wrap input[type="text"]:focus {
            outline: 2px solid var(--shu);
            outline-offset: -1px;
        }

        .search-wrap button {
            border: 1px solid var(--sumi);
            background: var(--sumi);
            color: var(--washi);
            padding: 0 26px;
            font-family: 'Noto Serif KR', serif;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 2px;
            cursor: pointer;
        }

        .search-wrap button:hover { background: var(--shu-deep); border-color: var(--shu-deep); }

        /* ===== 언어 스위처 ===== */
        .lang-switch {
            margin-top: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
        }
        .lang-switch a { color: var(--sumi-faint); text-decoration: none; }
        .lang-switch a:hover { color: var(--shu); }
        .lang-switch a.active { color: var(--sumi); font-weight: 700; }
        .lang-switch .sep { color: var(--washi-line); }

        /* ===== 반즈케/일문 탭 전환 ===== */
        .view-tabs {
            display: flex;
            gap: 2px;
            margin-bottom: -3px; /* .banzuke의 3px double border와 맞물리게 */
            position: relative;
            z-index: 1;
        }
        .view-tab {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--sumi-faint);
            background: var(--washi-panel);
            border: 1px solid var(--washi-line);
            border-bottom: none;
            padding: 8px 20px;
            cursor: pointer;
        }
        .view-tab:hover { color: var(--sumi); }
        .view-tab.active {
            color: var(--sumi);
            font-weight: 700;
            background: var(--washi);
            border-color: var(--sumi);
        }

        /* ===== 일문(一門) 탭 ===== */
        .ichimon-group { margin-bottom: 26px; }
        .ichimon-group:last-child { margin-bottom: 0; }
        .ichimon-title {
            font-family: 'Yuji Syuku', serif;
            font-size: 19px;
            letter-spacing: 2px;
            color: var(--shu);
            padding-bottom: 8px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--sumi);
        }
        .ichimon-heya-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        .ichimon-heya {
            border: 1px solid var(--washi-line);
            padding: 10px 12px;
        }
        .ichimon-heya-name {
            font-family: 'Noto Serif KR', serif;
            font-weight: 700;
            font-size: 13.5px;
            color: var(--sumi);
            margin-bottom: 6px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--washi-line);
        }
        .ichimon-sekitori-list { list-style: none; margin: 0; padding: 0; }
        .ichimon-sekitori-list li + li { margin-top: 4px; }
        .ichimon-sekitori-list a {
            display: flex;
            align-items: baseline;
            gap: 6px;
            text-decoration: none;
            font-size: 12.5px;
        }
        .ichimon-sekitori-list a:hover .isk-name { color: var(--shu); }
        .isk-rank {
            flex-shrink: 0;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 10.5px;
            color: var(--sumi-faint);
            white-space: nowrap;
        }
        .isk-name {
            font-family: 'Noto Serif KR', serif;
            color: var(--sumi);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .ichimon-heya-empty {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 11px;
            color: var(--sumi-faint);
        }

        /* ===== 키마리테(決まり手) 탭 - rikishi/detail.html 상대전적 패널과 같은 초성 인덱스 + 접이식 구조 ===== */
        .kimarite-index {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding-bottom: 14px;
            margin-bottom: 4px;
            border-bottom: 1px solid var(--washi-line);
        }
        .kimarite-index a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 24px;
            height: 24px;
            padding: 0 4px;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: var(--sumi-soft);
            border: 1px solid var(--washi-line);
            text-decoration: none;
        }
        .kimarite-index a:hover { border-color: var(--shu); color: var(--shu); }

        .kimarite-group { scroll-margin-top: 14px; }
        .kimarite-group + .kimarite-group { border-top: 1px solid var(--sumi); }

        .kimarite-group-summary {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 12px 4px;
            cursor: pointer;
            list-style: none;
            font-family: 'Yuji Syuku', serif;
            font-size: 20px;
            color: var(--shu);
        }
        .kimarite-group-summary::-webkit-details-marker { display: none; }
        .kimarite-group-summary::before {
            content: '▸';
            font-family: initial;
            font-size: 12px;
            color: var(--sumi-faint);
            transition: transform 0.15s ease;
        }
        .kimarite-group[open] > .kimarite-group-summary::before { transform: rotate(90deg); color: var(--shu); }
        .kimarite-group-count {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 11px;
            font-weight: 400;
            color: var(--sumi-faint);
        }
        .kimarite-group-body { padding-left: 4px; padding-bottom: 8px; }

        .kimarite-entry {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
            padding: 8px 4px;
        }
        .kimarite-entry + .kimarite-entry { border-top: 1px solid var(--washi-line); }
        .ke-kr { font-weight: 700; font-size: 14px; color: var(--sumi); }
        .ke-jp { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; color: var(--sumi-faint); }
        .ke-desc {
            flex-basis: 100%;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 12px;
            color: var(--sumi-faint);
        }

        /* ===== Banzuke Panel ===== */
        .banzuke {
            border: 3px double var(--sumi);
            background: transparent;
            padding: 4px;
        }

        .banzuke-inner {
            border: 1px solid var(--washi-line);
            padding: 18px 8px 24px;
        }

        .banzuke-title { text-align: center; margin-bottom: 18px; }

        .banzuke-title .jp {
            font-family: 'Yuji Syuku', serif;
            font-size: 30px;
            letter-spacing: 10px;
            display: block;
        }

        .banzuke-title .meta {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 12px;
            color: var(--sumi-soft);
            letter-spacing: 2px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .banzuke-title .meta .sep { color: var(--sumi-faint); }

        .panel-select {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--sumi);
            background: transparent;
            border: 1px solid var(--washi-line);
            border-radius: 0;
            padding: 4px 22px 4px 9px;
            cursor: pointer;
            appearance: none;
            background-image:
                linear-gradient(45deg, transparent 50%, var(--sumi-soft) 50%),
                linear-gradient(135deg, var(--sumi-soft) 50%, transparent 50%);
            background-position:
                calc(100% - 12px) center,
                calc(100% - 8px) center;
            background-size: 4px 4px, 4px 4px;
            background-repeat: no-repeat;
        }

        .panel-select:hover { border-color: var(--sumi); }
        .panel-select:focus { outline: 1px solid var(--shu); outline-offset: 1px; }

        /* ===== 동서 페어 테이블 ===== */
        table.banzuke-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .banzuke-table thead th {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 12px;
            letter-spacing: 4px;
            font-weight: 500;
            color: var(--sumi-faint);
            padding: 4px 0 12px;
            border-bottom: 1px solid var(--sumi);
        }

        .banzuke-table thead th.col-rank { width: 18%; }
        .banzuke-table thead th.col-east,
        .banzuke-table thead th.col-west { width: 41%; }

        .banzuke-table tbody tr {
            border-bottom: 1px solid var(--washi-line);
        }

        .banzuke-table tbody tr:hover {
            background: rgba(163, 39, 44, 0.04);
        }

        .rikishi-cell {
            padding: 10px 14px;
            text-align: center;
            vertical-align: middle;
        }

        .rikishi-cell.empty-slot {
            color: var(--sumi-faint);
            font-size: 13px;
        }

        .shikona-link {
            display: block;
            font-family: 'Noto Serif KR', serif;
            color: var(--sumi);
            text-decoration: none;
        }

        /* ja 화면: 番付 제목과 같은 붓글씨체(Yuji Syuku)로 통일 - Noto Serif KR은 Hangul용이라
           일본어 화면에서만 이걸로 바꾼다(한글은 이 폰트에 글리프가 없음). */
        .shikona-link.jp-font { font-family: 'Yuji Syuku', serif; }

        .shikona-link:hover { color: var(--shu); }

        .sub-info {
            margin-top: 3px;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 11px;
            letter-spacing: 0.5px;
            color: var(--sumi-faint);
        }

        .rank-cell {
            padding: 10px 4px;
            text-align: center;
            vertical-align: middle;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 13px;
            color: var(--shu);
            letter-spacing: 2px;
            border-left: 1px solid var(--washi-line);
            border-right: 1px solid var(--washi-line);
            white-space: nowrap;
        }

        /* 실제 반즈케처럼 계급이 높을수록 시코나를 크게 */
        .r-Yokozuna   { font-size: 26px; font-weight: 900; }
        .r-Ozeki      { font-size: 22px; font-weight: 700; }
        .r-Sekiwake,
        .r-Komusubi   { font-size: 18px; font-weight: 700; }
        .r-Maegashira { font-size: 15px; font-weight: 400; }
        .r-Juryo, .r-Makushita, .r-Sandanme,
        .r-Jonidan, .r-Jonokuchi { font-size: 13px; font-weight: 400; }

        .empty-row {
            text-align: center;
            padding: 50px 0;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            color: var(--sumi-faint);
            font-size: 13px;
            letter-spacing: 1px;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--sumi-faint);
        }

        @media (max-width: 560px) {
            .brand-jp { font-size: 30px; }
            .r-Yokozuna { font-size: 19px; }
            .r-Ozeki { font-size: 17px; }
            .r-Sekiwake, .r-Komusubi { font-size: 14px; }
            .r-Maegashira { font-size: 12.5px; }
            .rikishi-cell { padding: 8px 6px; }
            .sub-info { font-size: 9.5px; }
            .rank-cell { font-size: 11px; letter-spacing: 0.5px; }
            .banzuke-table thead th { font-size: 10px; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
<div class="page">

    <header>
        <div class="seal">相撲</div>
        <div class="brand-row">
            <a class="brand-jp" th:href="@{/}">相撲archive</a>
            <span class="brand-kr">스모아카이브</span>
        </div>
        <div class="brand-sub">SUMO RANKING &amp; RIKISHI ARCHIVE</div>

        <div class="search-wrap">
            <form th:action="@{/search}" method="get" style="display: flex; gap: 10px; flex: 1;">
                <input type="text" name="keyword" th:placeholder="#{main.search.placeholder}" placeholder="시코나 검색">
                <button type="submit" th:text="#{main.search.button}">검색</button>
            </form>
            <a th:href="@{/bookmark}" th:text="#{main.bookmark.link}" style="white-space: nowrap; align-self: center; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; color: var(--sumi-soft); text-decoration: none;">★ 즐겨찾기</a>
        </div>

        <!-- 언어 스위처(시범: 메인 페이지만) - 세션에 언어를 저장해두는 LocaleChangeInterceptor(WebConfig)가 처리 -->
        <div class="lang-switch">
            <a th:href="@{''(lang='ko')}" th:classappend="${#locale.language == 'ko'} ? 'active'" th:text="#{main.lang.ko}">한국어</a>
            <span class="sep">/</span>
            <a th:href="@{''(lang='ja')}" th:classappend="${#locale.language == 'ja'} ? 'active'" th:text="#{main.lang.ja}">日本語</a>
        </div>
    </header>

    <!-- 반즈케 / 일문 탭 전환. 일문 탭은 최신 바쇼 기준으로 서버에서 통째로 렌더링해두고
         (하단 .ichimon-panel), JS는 단순히 두 패널의 hidden만 토글한다. -->
    <div class="view-tabs">
        <button type="button" class="view-tab active" id="tabBanzuke" th:text="#{main.tab.banzuke}">반즈케</button>
        <button type="button" class="view-tab" id="tabIchimon" th:text="#{main.tab.ichimon}">일문</button>
        <button type="button" class="view-tab" id="tabKimarite" th:text="#{main.tab.kimarite}">키마리테</button>
    </div>

    <div class="banzuke" id="banzukePanel">
        <div class="banzuke-inner">
            <div class="banzuke-title">
                <span class="jp">番付</span>
                <span class="meta">
                    <select class="panel-select" id="year-select" aria-label="연도 선택"></select>
                    <select class="panel-select" id="basho-select" aria-label="대회 선택"></select>
<!--                    <span class="sep">·</span>-->
                    <select class="panel-select" id="division-select" aria-label="계급 선택">
                        <option value="Makuuchi" th:text="#{main.division.makuuchi}">마쿠우치</option>
                        <option value="Juryo" th:text="#{main.division.juryo}">주료</option>
                        <option value="Makushita" th:text="#{main.division.makushita}">마쿠시타</option>
                        <option value="Sandanme" th:text="#{main.division.sandanme}">산단메</option>
                        <option value="Jonidan" th:text="#{main.division.jonidan}">조니단</option>
                        <option value="Jonokuchi" th:text="#{main.division.jonokuchi}">조노구치</option>
                    </select>
                </span>
            </div>

            <table class="banzuke-table">
                <thead>
                <tr>
                    <th class="col-east" th:text="#{main.table.east}">동</th>
                    <th class="col-rank" th:text="#{main.table.rank}">반즈케</th>
                    <th class="col-west" th:text="#{main.table.west}">서</th>
                </tr>
                </thead>
                <tbody id="banzuke-body">
                <tr><td colspan="3" class="empty-row" th:text="#{main.table.loading}">불러오는 중…</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ===== 일문(一門) 탭 - 이치몬별 헤야, 그 안에 세키토리(마쿠우치+주료) 명단.
         세키토리가 없는 헤야도 이름은 그대로 남긴다(헤야 구조 전체를 보여주는 게 목적). -->
    <div class="banzuke ichimon-panel" id="ichimonPanel" hidden>
        <div class="banzuke-inner">
            <div class="banzuke-title">
                <span class="jp">一門</span>
            </div>

            <div class="empty-row" th:if="${ichimonGroups == null or ichimonGroups.isEmpty()}" th:text="#{main.table.empty}">등록된 반즈케가 없습니다.</div>

            <div class="ichimon-group" th:each="g : ${ichimonGroups}">
                <div class="ichimon-title" th:text="${#locale.language == 'ja'} ? ${g.ichimonJp} : ${g.ichimonKr}">일문</div>
                <div class="ichimon-heya-grid">
                    <div class="ichimon-heya" th:each="h : ${g.heyaList}">
                        <div class="ichimon-heya-name" th:text="${#locale.language == 'ja'} ? ${h.heyaNameJp} : ${h.heyaNameKr}">헤야</div>
                        <ul class="ichimon-sekitori-list" th:if="${!h.sekitori.isEmpty()}">
                            <li th:each="s : ${h.sekitori}">
                                <a th:href="@{/rikishi/{id}(id=${s.rikishiId})}">
                                    <span class="isk-rank" th:text="${#locale.language == 'ja'} ? ${s.rankDisplayJp} : ${s.rankDisplayKr}">前頭10枚目</span>
                                    <span class="isk-name" th:text="${#locale.language == 'ja'} ? ${s.shikonaJp} : ${s.shikonaKr}">시코나</span>
                                </a>
                            </li>
                        </ul>
                        <div class="ichimon-heya-empty" th:if="${h.sekitori.isEmpty()}" th:text="#{main.ichimon.none}">세키토리 없음</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 키마리테(決まり手) 탭 - 결정기술 백과사전 UI 틀. 설명(description)은 아직 콘텐츠가
         없어서 전부 비어있고 "설명 준비 중"으로 대체 표시된다 - 나중에 하나씩 채워 넣을 예정.
         상대전적 패널(rikishi/detail.html)과 같은 ㄱㄴㄷ 초성 인덱스 + 접이식 구조. -->
    <div class="banzuke kimarite-panel" id="kimaritePanel" hidden>
        <div class="banzuke-inner">
            <div class="banzuke-title">
                <span class="jp">決まり手</span>
            </div>

            <div class="empty-row" th:if="${kimariteGroups == null or kimariteGroups.isEmpty()}" th:text="#{main.table.empty}">등록된 반즈케가 없습니다.</div>

            <nav class="kimarite-index">
                <a th:each="g : ${kimariteGroups}" th:href="'#kimarite-grp-' + ${g.initial}" th:text="${g.initial}">ㄱ</a>
            </nav>

            <details class="kimarite-group" th:each="g : ${kimariteGroups}" th:id="'kimarite-grp-' + ${g.initial}">
                <summary class="kimarite-group-summary">
                    <span th:text="${g.initial}">ㄱ</span>
                    <span class="kimarite-group-count" th:text="'(' + ${g.entries.size()} + ')'">(3)</span>
                </summary>
                <div class="kimarite-group-body">
                    <div class="kimarite-entry" th:each="e : ${g.entries}">
                        <span class="ke-kr" th:text="${e.kimariteKr}">요리키리</span>
                        <span class="ke-jp" th:text="${e.kimariteJp}">寄り切り</span>
                        <span class="ke-desc" th:if="${e.description == null}" th:text="#{main.kimarite.pending}">설명 준비 중</span>
                        <span class="ke-desc" th:if="${e.description != null}" th:text="${e.description}"></span>
                    </div>
                </div>
            </details>
        </div>
    </div>

    <footer th:text="#{main.footer}">SUMOARCHIVE — 韓国語で見る大相撲情報アーカイブ</footer>
</div>

<script th:inline="javascript">
    // 서버에서 내려준 바쇼 목록(최신순). 연/대회 드롭다운을 이걸로 구성한다.
    const BASHO_OPTIONS = /*[[${bashoOptions}]]*/ [];
    // 반즈케 표는 fetch로 비동기 렌더링돼서(loadBanzuke) 언어별 라벨을 서버가 아니라 JS가 골라야 함.
    const LOCALE = /*[[${#locale.language}]]*/ 'ko';
    const MSG_EMPTY = /*[[#{main.table.empty}]]*/ '등록된 반즈케가 없습니다.';
    const MSG_ERROR = /*[[#{main.table.error}]]*/ '데이터를 불러오지 못했습니다.';

    const tbody = document.getElementById('banzuke-body');
    const yearSelect = document.getElementById('year-select');
    const bashoSelect = document.getElementById('basho-select');
    const divisionSelect = document.getElementById('division-select');

    // 계급 정렬 순서 (숫자가 작을수록 위쪽)
    const RANK_ORDER = {
        Yokozuna: 0, Ozeki: 1, Sekiwake: 2, Komusubi: 3, Maegashira: 4,
        Juryo: 5, Makushita: 6, Sandanme: 7, Jonidan: 8, Jonokuchi: 9
    };

    // 반즈케 칸(番付欄) 표기용 라벨 - 언어별 (ja는 RankDisplayUtil.LABEL과 동일한 일본어 표기)
    const RANK_LABEL_BY_LOCALE = {
        ko: {
            Yokozuna: '요코즈나', Ozeki: '오제키', Sekiwake: '세키와케', Komusubi: '코무스비',
            Maegashira: '마에가시라', Juryo: '주료', Makushita: '마쿠시타',
            Sandanme: '산단메', Jonidan: '조니단', Jonokuchi: '조노구치'
        },
        ja: {
            Yokozuna: '横綱', Ozeki: '大関', Sekiwake: '関脇', Komusubi: '小結',
            Maegashira: '前頭', Juryo: '十両', Makushita: '幕下',
            Sandanme: '三段目', Jonidan: '序二段', Jonokuchi: '序ノ口'
        }
    };
    const RANK_LABEL = RANK_LABEL_BY_LOCALE[LOCALE] || RANK_LABEL_BY_LOCALE.ko;

    // ===== 연 / 대회 드롭다운 구성 =====
    function uniqueYearsDesc() {
        return [...new Set(BASHO_OPTIONS.map(b => b.year))].sort((a, b) => b - a);
    }

    function fillYearSelect() {
        yearSelect.innerHTML = '';
        uniqueYearsDesc().forEach(y => {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y + '年';
            yearSelect.appendChild(opt);
        });
    }

    // 선택된 연도의 대회만 (월 내림차순) 대회 드롭다운에 채운다. option value = bashoId
    function fillBashoSelect(year) {
        bashoSelect.innerHTML = '';
        BASHO_OPTIONS
            .filter(b => b.year === year)
            .sort((a, b) => b.month - a.month)
            .forEach(b => {
                const opt = document.createElement('option');
                opt.value = b.id;
                opt.textContent = b.monthLabel;
                bashoSelect.appendChild(opt);
            });
    }

    yearSelect.addEventListener('change', () => {
        fillBashoSelect(Number(yearSelect.value));
        loadBanzuke();
    });
    bashoSelect.addEventListener('change', loadBanzuke);
    divisionSelect.addEventListener('change', loadBanzuke);

    function loadBanzuke() {
        const bashoId = bashoSelect.value;
        const division = divisionSelect.value;
        const url = bashoId
            ? `/api/banzuke?division=${division}&bashoId=${bashoId}`
            : `/api/banzuke?division=${division}`;
        fetch(url)
            .then(response => {
                if (!response.ok) throw new Error('서버 응답 오류: ' + response.status);
                return response.json();
            })
            .then(renderTable)
            .catch(error => {
                console.error('반즈케 조회 실패:', error);
                tbody.innerHTML = '<tr><td colspan="3" class="empty-row"></td></tr>';
                tbody.querySelector('.empty-row').textContent = MSG_ERROR;
            });
    }

    // 같은 계급/순번(rankName + rankValue)의 東/西를 한 행으로 묶기
    function pairByRank(data) {
        const map = new Map();

        data.forEach(row => {
            const key = row.rankName + '-' + (row.rankValue ?? '');
            if (!map.has(key)) {
                map.set(key, { rankName: row.rankName, rankValue: row.rankValue, east: null, west: null });
            }
            const entry = map.get(key);
            if (row.side === 'EAST') entry.east = row;
            else entry.west = row;
        });

        return Array.from(map.values()).sort((a, b) => {
            const orderDiff = RANK_ORDER[a.rankName] - RANK_ORDER[b.rankName];
            if (orderDiff !== 0) return orderDiff;
            return (a.rankValue ?? 0) - (b.rankValue ?? 0);
        });
    }

    function rankCellText(rankName, rankValue) {
        const label = RANK_LABEL[rankName] || rankName;
        // 마에가시라/주료 이하는 순번을 붙임 (예: 前頭10)
        if (rankValue != null && (rankName === 'Maegashira' || RANK_ORDER[rankName] >= RANK_ORDER.Juryo)) {
            return label + rankValue;
        }
        return label;
    }

    function makeRikishiCell(row, rankName) {
        const td = document.createElement('td');
        td.className = 'rikishi-cell';

        if (!row) {
            td.classList.add('empty-slot');
            td.textContent = '—';
            return td;
        }

        const link = document.createElement('a');
        link.className = 'shikona-link r-' + rankName + (LOCALE === 'ja' ? ' jp-font' : '');
        link.href = '/rikishi/' + row.rikishiId;
        // ja 화면은 일본어 한자를 우선, 없으면 로마자로. ko(기본)는 한국어 우선, sumo-api 임포트
        // 직후엔 한국어 시코나가 비어 있어 일본어(한자)→로마자 순으로 폴백.
        const shikona = LOCALE === 'ja'
            ? (row.shikonaJp || row.shikonaEn || row.shikonaKr || '?')
            : (row.shikonaKr || row.shikonaJp || row.shikonaEn || '?');
        // "아사노야마 히로키"처럼 시코나+이름이 함께 들어온 경우 공백 앞부분(시코나)만 표시
        link.textContent = shikona.split(' ')[0];
        link.title = shikona; // 전체 표기는 툴팁으로 확인 가능

        const sub = document.createElement('div');
        sub.className = 'sub-info';
        // ko: 출신지(도도부현/국가, 한글) · 소속 헤야(한글). ja: 출신지(도도부현 한자/국가 가타카나) ·
        // 소속 헤야(일본어, 대부분 아직 로마자 임시값). 둘 다 없으면 표시 생략.
        sub.textContent = LOCALE === 'ja'
            ? [row.originJp, row.heyaNameJp].filter(Boolean).join(' · ')
            : [row.originKr, row.heyaNameKr].filter(Boolean).join(' · ');

        td.appendChild(link);
        if (sub.textContent) td.appendChild(sub);
        return td;
    }

    function renderTable(data) {
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="empty-row"></td></tr>';
            tbody.querySelector('.empty-row').textContent = MSG_EMPTY;
            return;
        }

        const paired = pairByRank(data);

        paired.forEach(entry => {
            const tr = document.createElement('tr');

            tr.appendChild(makeRikishiCell(entry.east, entry.rankName));

            const rankTd = document.createElement('td');
            rankTd.className = 'rank-cell';
            rankTd.textContent = rankCellText(entry.rankName, entry.rankValue);
            tr.appendChild(rankTd);

            tr.appendChild(makeRikishiCell(entry.west, entry.rankName));

            tbody.appendChild(tr);
        });
    }

    // 최초 진입: 최신 연도 · 그 연도의 최신 대회 · 마쿠우치
    fillYearSelect();
    if (yearSelect.options.length > 0) {
        fillBashoSelect(Number(yearSelect.value));
    }
    loadBanzuke();

    // ===== 반즈케 / 일문 / 키마리테 탭 전환 =====
    // 일문·키마리테 패널은 서버가 이미 렌더링해서 내려준 정적 HTML이라, 여기선 hidden 속성만 토글하면 된다.
    (function () {
        var tabs = {
            banzuke: { btn: document.getElementById('tabBanzuke'), panel: document.getElementById('banzukePanel') },
            ichimon: { btn: document.getElementById('tabIchimon'), panel: document.getElementById('ichimonPanel') },
            kimarite: { btn: document.getElementById('tabKimarite'), panel: document.getElementById('kimaritePanel') }
        };

        function show(name) {
            Object.keys(tabs).forEach(function (key) {
                var active = key === name;
                tabs[key].btn.classList.toggle('active', active);
                tabs[key].panel.hidden = !active;
            });
        }

        Object.keys(tabs).forEach(function (key) {
            tabs[key].btn.addEventListener('click', function () { show(key); });
        });
    })();

    // ===== 키마리테 ㄱㄴㄷ 인덱스 - 상대전적 패널과 동일한 방식(인덱스 클릭/딥링크 시 그룹 강제로 열기) =====
    (function () {
        function openGroup(hash) {
            if (!hash || hash.indexOf('#kimarite-grp-') !== 0) return;
            var el = document.getElementById(hash.slice(1));
            if (el) el.open = true;
        }
        document.querySelectorAll('.kimarite-index a').forEach(function (a) {
            a.addEventListener('click', function () { openGroup(a.getAttribute('href')); });
        });
        // 키마리테 그룹으로 바로 들어온 딥링크면 탭도 같이 전환해줘야 보인다.
        if (location.hash && location.hash.indexOf('#kimarite-grp-') === 0) {
            document.getElementById('tabKimarite').click();
            openGroup(location.hash);
        }
    })();
</script>
</body>
</html>
