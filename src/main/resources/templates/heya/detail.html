<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:with="isJa=${#locale.language == 'ja'}, heyaName=${isJa ? heya.nameJp : heya.nameKr}, ichimonName=${isJa ? heya.ichimonJp : heya.ichimonKr}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title th:text="#{seo.heya.title(${heyaName})}">헤야 — 스모아카이브</title>
    <th:block th:replace="~{fragments/common :: seo(#{seo.heya.title(${heyaName})}, #{seo.heya.desc(${heyaName}, ${ichimonName} ?: '-', ${heya.memberCount()})}, ${!heya.divisions.isEmpty()})}"></th:block>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Noto+Serif+KR:wght@400;600;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sumi: #1a1a18;
            --sumi-soft: #56554e;
            --sumi-faint: #86857f;
            --washi: #f7f6f3;
            --washi-line: rgba(26, 26, 24, 0.14);
            --shu: #a3272c;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: var(--washi);
            background-image:
                    repeating-linear-gradient(90deg, rgba(26,26,24,0.022) 0px, rgba(26,26,24,0.022) 1px, transparent 1px, transparent 3px),
                    repeating-linear-gradient(0deg, rgba(26,26,24,0.012) 0px, rgba(26,26,24,0.012) 1px, transparent 1px, transparent 5px);
            color: var(--sumi);
            font-family: 'Noto Serif KR', serif;
            line-height: 1.75;
            min-height: 100vh;
        }
        .page { max-width: 760px; margin: 0 auto; padding: 40px 24px 80px; }
        a { color: inherit; }

        header { position: relative; border: 3px double var(--sumi); padding: 22px 28px 18px; margin-bottom: 26px; }
        .brand-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
        .brand-jp { font-family: 'Yuji Syuku', serif; font-size: 28px; letter-spacing: 3px; color: var(--sumi); text-decoration: none; }
        .brand-kr { font-family: 'Noto Serif KR', serif; font-weight: 900; font-size: 15px; letter-spacing: 1px; color: var(--sumi-soft); }
        .breadcrumb { margin-top: 10px; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; letter-spacing: 1px; color: var(--sumi-faint); }
        .breadcrumb a:hover { color: var(--shu); }
        /* 언어 스위처 (fragments/common :: langSwitch) */
        .lang-switch { margin-top: 10px; display: flex; align-items: center; gap: 6px; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 11px; letter-spacing: 1px; }
        .lang-switch a { color: var(--sumi-faint); text-decoration: none; }
        .lang-switch a:hover { color: var(--shu); }
        .lang-switch a.active { color: var(--sumi); font-weight: 700; }
        .lang-switch .sep { color: var(--washi-line); }

        .heya-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
        h1 { font-size: 22px; letter-spacing: 1px; margin: 0; }
        .heya-name-jp { font-family: 'Yuji Syuku', serif; font-size: 17px; letter-spacing: 2px; color: var(--sumi-soft); }
        .heya-ichimon { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; letter-spacing: 1px; color: var(--shu); }
        .lead { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; letter-spacing: 1px; color: var(--sumi-faint); margin: 0 0 22px; }

        .division { margin-bottom: 22px; }
        .division-title {
            font-family: 'Yuji Syuku', serif; font-size: 17px; letter-spacing: 2px; color: var(--shu);
            padding-bottom: 6px; border-bottom: 1px solid var(--sumi); margin: 0;
        }
        .division-title .count { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 11px; letter-spacing: 0; color: var(--sumi-faint); margin-left: 6px; }
        .member-table { width: 100%; border-collapse: collapse; }
        .member-table th {
            text-align: left; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 500; font-size: 11px;
            letter-spacing: 1px; color: var(--sumi-faint); padding: 6px 8px; border-bottom: 1px solid var(--washi-line);
        }
        .member-table td { padding: 7px 8px; border-bottom: 1px solid var(--washi-line); font-size: 14px; vertical-align: baseline; }
        .member-table .col-rank { width: 34%; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; color: var(--sumi-soft); white-space: nowrap; }
        .member-table .col-origin { width: 26%; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; color: var(--sumi-soft); }
        .member-table a { text-decoration: none; }
        .member-table a:hover { color: var(--shu); }
        .member-table .name-jp { font-family: 'Yuji Syuku', serif; font-size: 12px; color: var(--sumi-faint); margin-left: 6px; }
        .empty { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 13px; color: var(--sumi-faint); padding: 20px 0; }
        @media (max-width: 560px) {
            .member-table .col-origin { display: none; }
        }

        footer { text-align: center; margin-top: 40px; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 11px; letter-spacing: 2px; color: var(--sumi-faint); }
    </style>
</head>
<body>
<div class="page">

    <header>
        <div class="brand-row">
            <a class="brand-jp" th:href="@{/}">相撲archive</a>
            <span class="brand-kr" th:text="#{site.title}">스모아카이브</span>
        </div>
        <div class="breadcrumb">
            <a th:href="@{/}" th:text="#{common.nav.banzuke}">반즈케</a> &gt;
            <a th:href="@{/(tab='ichimon')}" th:text="#{main.tab.ichimon}">일문</a> &gt;
            <span th:text="#{heya.title(${heyaName})}">헤야</span>
        </div>
        <th:block th:replace="~{fragments/common :: langSwitch}"></th:block>
    </header>

    <div class="heya-head">
        <h1 th:text="#{heya.title(${heyaName})}">이세가하마 베야</h1>
        <span class="heya-name-jp" th:unless="${isJa}" th:text="${heya.nameJp} + '部屋'">伊勢ヶ濱部屋</span>
        <span class="heya-ichimon" th:if="${ichimonName != null}" th:text="${ichimonName}">이세가하마이치몬</span>
    </div>
    <!-- 연도는 문자열로 넘긴다 - 숫자로 넘기면 MessageFormat이 "2,026"으로 찍는다 -->
    <p class="lead" th:if="${heya.bashoYear != null}"
       th:text="#{heya.basis(${#strings.toString(heya.bashoYear)}, ${isJa ? heya.bashoNameJp : heya.bashoNameKr}, ${heya.memberCount()})}">2026년 아키바쇼 반즈케 기준 · 12명</p>

    <!-- 소속 선수 0명 = 폐업했거나 개명 전 옛 이름의 헤야 (HeyaService#currentMemberCounts). 페이지는 남겨 두고 색인만 뺀다 -->
    <div class="empty" th:if="${heya.divisions.isEmpty() and heya.bashoYear != null}"
         th:text="#{heya.empty(${isJa ? heya.bashoYear + '年' + heya.bashoNameJp : heya.bashoYear + '년 ' + heya.bashoNameKr})}">최신 반즈케에 소속 선수가 없어요.</div>
    <div class="empty" th:if="${heya.bashoYear == null}" th:text="#{main.table.empty}">등록된 반즈케가 없습니다.</div>

    <section class="division" th:each="d : ${heya.divisions}">
        <h2 class="division-title">
            <span th:text="#{${'main.division.' + d.division}}">마쿠우치</span><span class="count" th:text="${d.members.size()}">3</span>
        </h2>
        <table class="member-table">
            <thead>
            <tr>
                <th class="col-rank" th:text="#{heya.col.rank}">지위</th>
                <th th:text="#{heya.col.name}">시코나</th>
                <th class="col-origin" th:text="#{heya.col.origin}">출신</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${d.members}">
                <td class="col-rank" th:text="${isJa ? m.rankDisplayJp : m.rankDisplayKr}">마에가시라10</td>
                <td>
                    <a th:href="@{/rikishi/{id}(id=${m.rikishiId})}" th:text="${isJa ? (m.shikonaJp ?: m.shikonaKr) : m.shikonaKr}">시코나</a>
                    <span class="name-jp" th:if="${!isJa and m.shikonaJp != null}" th:text="${m.shikonaJp}">四股名</span>
                </td>
                <td class="col-origin" th:text="${isJa ? m.originJp : m.originKr} ?: '-'">출신</td>
            </tr>
            </tbody>
        </table>
    </section>

    <footer><span th:text="#{main.footer}">SUMOARCHIVE — 韓国語で見る大相撲情報アーカイブ</span><th:block th:replace="~{fragments/common :: footerNote}"></th:block></footer>
</div>
</body>
</html>
