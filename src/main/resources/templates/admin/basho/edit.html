<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${form.year} + '년 ' + ${form.month} + '월 ' + ${form.monthLabelKr} + ' 수정 | 스모아카이브 관리자'">바쇼 수정</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sumi: #1a1a18; --sumi-soft: #56554e; --sumi-faint: #86857f;
            --washi: #f7f6f3; --washi-line: rgba(26, 26, 24, 0.14);
            --shu: #a3272c; --shu-faint: rgba(163, 39, 44, 0.10);
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background-color: var(--washi); color: var(--sumi); font-family: 'Noto Serif KR', serif; }
        .page { max-width: 560px; margin: 0 auto; padding: 32px 24px 60px; }
        a { color: inherit; }

        header { border-bottom: 3px double var(--sumi); padding-bottom: 14px; margin-bottom: 22px; }
        .header-top { display: flex; align-items: baseline; justify-content: space-between; }
        h1 { font-size: 19px; margin: 0; letter-spacing: 1px; }
        .back-link { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; color: var(--sumi-soft); text-decoration: none; }
        .back-link:hover { color: var(--shu); }
        .admin-nav { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; margin-top: 10px; }
        .admin-nav a { color: var(--sumi-soft); text-decoration: none; margin-right: 14px; }
        .admin-nav a:hover, .admin-nav a.current { color: var(--shu); }

        .saved-msg { background: var(--shu-faint); color: var(--shu); font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 13px; padding: 10px 14px; margin-bottom: 18px; }
        .error-msg { border: 1px solid var(--shu); color: var(--shu); font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 13px; padding: 10px 14px; margin-bottom: 18px; }

        fieldset { border: 1px solid var(--washi-line); margin-bottom: 18px; padding: 14px 16px 18px; }
        legend { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; letter-spacing: 1px; color: var(--sumi-faint); padding: 0 6px; }
        .field-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
        .field { flex: 1; min-width: 150px; }
        label { display: block; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 11.5px; color: var(--sumi-soft); margin-bottom: 5px; }
        input[type="date"] {
            width: 100%; padding: 8px 10px; border: 1px solid var(--washi-line);
            background: #fff; font-family: 'Noto Serif KR', serif; font-size: 13.5px; color: var(--sumi);
        }
        input:focus { outline: none; border-color: var(--shu); box-shadow: inset 0 0 0 1px var(--shu); }
        .readonly-line { font-size: 15px; }
        .hint { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 11px; color: var(--sumi-faint); margin: 4px 0 0; }

        .actions { display: flex; justify-content: space-between; align-items: center; }
        button[type="submit"].save {
            border: 1px solid var(--sumi); background: var(--sumi); color: var(--washi);
            font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 13px; letter-spacing: 1px;
            padding: 10px 24px; cursor: pointer;
        }
        button[type="submit"].save:hover { background: var(--shu); border-color: var(--shu); }
        .delete-form button {
            border: 1px solid var(--washi-line); background: transparent; color: var(--sumi-soft);
            font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; padding: 9px 16px; cursor: pointer;
        }
        .delete-form button:hover { border-color: var(--shu); color: var(--shu); }
    </style>
</head>
<body>
<div class="page">
    <header>
        <div class="header-top">
            <h1 th:text="${form.year} + '년 ' + ${form.month} + '월 ' + ${form.monthLabelKr} + ' 수정'">바쇼 수정</h1>
            <a class="back-link" th:href="@{/admin/basho}">← 바쇼 목록</a>
        </div>
        <nav class="admin-nav">
            <a th:href="@{/admin/comments}">댓글 관리</a>
            <a th:href="@{/admin/rikishi}">리키시 관리</a>
            <a th:href="@{/admin/heya}">헤야 관리</a>
            <a th:href="@{/admin/basho}" class="current">반즈케 관리</a>
        </nav>
    </header>

    <p class="saved-msg" th:if="${saved}">저장했습니다.</p>
    <p class="error-msg" th:if="${error}" th:text="${error}">오류</p>

    <form th:action="@{'/admin/basho/' + ${form.id}}" th:object="${form}" method="post">
        <fieldset>
            <legend>바쇼 기간</legend>
            <div class="field-row">
                <div class="field">
                    <label>바쇼</label>
                    <div class="readonly-line" th:text="${form.year} + '년 ' + ${form.month} + '월 · ' + ${form.monthLabelKr}">2026년 7월 · 나고야바쇼</div>
                    <p class="hint">연도·월은 바쇼의 정체성이라 수정할 수 없습니다 (필요 시 삭제 후 재생성).</p>
                </div>
            </div>
            <div class="field-row">
                <div class="field"><label>시작일</label><input type="date" th:field="*{startDate}"></div>
                <div class="field"><label>종료일</label><input type="date" th:field="*{endDate}"></div>
            </div>
        </fieldset>
        <div class="actions">
            <button type="submit" class="save">저장</button>
        </div>
    </form>

    <form class="delete-form" style="margin-top: 22px;"
          th:action="@{'/admin/basho/' + ${form.id} + '/delete'}" method="post"
          onsubmit="return confirm('이 바쇼를 삭제할까요? (반즈케·토리쿠미가 남아있으면 삭제되지 않습니다)');">
        <button type="submit">바쇼 삭제</button>
        <span class="hint">반즈케·토리쿠미가 하나도 없을 때만 삭제됩니다.</span>
    </form>
</div>
</body>
</html>
