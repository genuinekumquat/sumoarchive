<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="(${form.shikonaKr} ?: '리키시') + ' 수정 | 스모아카이브 관리자'">리키시 수정</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sumi: #1a1a18; --sumi-soft: #56554e; --sumi-faint: #86857f;
            --washi: #f7f6f3; --washi-line: rgba(26, 26, 24, 0.14);
            --shu: #a3272c; --shu-faint: rgba(163, 39, 44, 0.10);
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background-color: var(--washi); color: var(--sumi); font-family: 'Noto Serif KR', serif; }
        .page { max-width: 640px; margin: 0 auto; padding: 32px 24px 60px; }
        a { color: inherit; }

        header { border-bottom: 3px double var(--sumi); padding-bottom: 14px; margin-bottom: 22px; }
        .header-top { display: flex; align-items: baseline; justify-content: space-between; }
        h1 { font-size: 19px; margin: 0; letter-spacing: 1px; }
        .back-link { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; color: var(--sumi-soft); text-decoration: none; }
        .back-link:hover { color: var(--shu); }
        .admin-nav { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; margin-top: 10px; }
        .admin-nav a { color: var(--sumi-soft); text-decoration: none; margin-right: 14px; }
        .admin-nav a:hover, .admin-nav a.current { color: var(--shu); }

        .saved-msg {
            background: var(--shu-faint); color: var(--shu);
            font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 13px;
            padding: 10px 14px; margin-bottom: 18px;
        }

        fieldset { border: 1px solid var(--washi-line); margin-bottom: 18px; padding: 14px 16px 18px; }
        legend { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; letter-spacing: 1px; color: var(--sumi-faint); padding: 0 6px; }

        .field-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
        .field { flex: 1; min-width: 160px; }
        .field.full { flex-basis: 100%; }
        label { display: block; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 11.5px; color: var(--sumi-soft); margin-bottom: 5px; }
        input[type="text"], input[type="date"], input[type="number"], select {
            width: 100%; padding: 8px 10px; border: 1px solid var(--washi-line);
            background: #fff; font-family: 'Noto Serif KR', serif; font-size: 13.5px; color: var(--sumi);
        }
        input:focus, select:focus { outline: none; border-color: var(--shu); box-shadow: inset 0 0 0 1px var(--shu); }

        .checkbox-row { display: flex; align-items: center; gap: 8px; }
        .checkbox-row label { margin: 0; }

        .actions { display: flex; justify-content: flex-end; }
        button[type="submit"] {
            border: 1px solid var(--sumi); background: var(--sumi); color: var(--washi);
            font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 13px; letter-spacing: 1px;
            padding: 10px 24px; cursor: pointer;
        }
        button[type="submit"]:hover { background: var(--shu); border-color: var(--shu); }
    </style>
</head>
<body>
<div class="page">
    <header>
        <div class="header-top">
            <h1 th:text="${form.shikonaKr} + ' (#' + ${form.id} + ') 수정'">리키시 수정</h1>
            <a class="back-link" th:href="@{/admin/rikishi}">← 목록으로</a>
        </div>
        <nav class="admin-nav">
            <a th:href="@{/admin/comments}">댓글 관리</a>
            <a th:href="@{/admin/rikishi}" class="current">리키시 관리</a>
        </nav>
    </header>

    <p class="saved-msg" th:if="${saved}">저장했습니다.</p>

    <form th:action="@{'/admin/rikishi/' + ${form.id} + '/edit'}" th:object="${form}" method="post">

        <fieldset>
            <legend>기본 정보</legend>
            <div class="field-row">
                <div class="field"><label>시코나 (한국어)</label><input type="text" th:field="*{shikonaKr}"></div>
                <div class="field"><label>시코나 (일본어)</label><input type="text" th:field="*{shikonaJp}"></div>
            </div>
            <div class="field-row">
                <div class="field full"><label>본명</label><input type="text" th:field="*{name}"></div>
            </div>
            <div class="field-row">
                <div class="field"><label>생년월일</label><input type="date" th:field="*{birthdate}"></div>
                <div class="field"><label>출신지</label><input type="text" th:field="*{birthplace}"></div>
                <div class="field"><label>국적</label><input type="text" th:field="*{nationality}"></div>
            </div>
            <div class="field-row">
                <div class="field"><label>신장 (cm)</label><input type="number" step="0.1" th:field="*{height}"></div>
                <div class="field"><label>체중 (kg)</label><input type="number" step="0.1" th:field="*{weight}"></div>
                <div class="field">
                    <label>소속 헤야</label>
                    <select th:field="*{heyaId}">
                        <option value="">무소속</option>
                        <option th:each="h : ${heyaOptions}" th:value="${h.id}" th:text="${h.nameKr}">헤야</option>
                    </select>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>계급 / 커리어</legend>
            <div class="field-row">
                <div class="field">
                    <label>현재 계급</label>
                    <select th:field="*{currentRank}">
                        <option value="">(미지정)</option>
                        <option th:each="rn : ${rankOptions}" th:value="${rn}" th:text="${rn}">Maegashira</option>
                    </select>
                </div>
                <div class="field">
                    <label>최고 계급</label>
                    <select th:field="*{highestRank}">
                        <option value="">(미지정)</option>
                        <option th:each="rn : ${rankOptions}" th:value="${rn}" th:text="${rn}">Ozeki</option>
                    </select>
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>파이팅 스타일</label>
                    <select th:field="*{fightingStyle}">
                        <option value="">(미분류)</option>
                        <option value="오시">오시</option>
                        <option value="요츠">요츠</option>
                        <option value="복합형">복합형</option>
                        <option value="변칙형">변칙형</option>
                    </select>
                </div>
                <div class="field"><label>데뷔일</label><input type="date" th:field="*{debutDate}"></div>
            </div>
        </fieldset>

        <fieldset>
            <legend>현역 / 은퇴</legend>
            <div class="field-row">
                <div class="field checkbox-row">
                    <input type="checkbox" id="active" th:field="*{active}">
                    <label for="active">현역</label>
                </div>
                <div class="field"><label>은퇴일 (현역이면 비워둠)</label><input type="date" th:field="*{retiredDate}"></div>
            </div>
            <div class="field-row">
                <div class="field"><label>오야카타 습명 (한국어)</label><input type="text" th:field="*{oyakataNameKr}"></div>
                <div class="field"><label>오야카타 습명 (일본어)</label><input type="text" th:field="*{oyakataNameJp}"></div>
            </div>
        </fieldset>

        <fieldset>
            <legend>사진</legend>
            <div class="field-row">
                <div class="field full"><label>사진 URL</label><input type="text" th:field="*{photoUrl}" placeholder="/images/rikishi/xxx.webp"></div>
            </div>
        </fieldset>

        <div class="actions">
            <button type="submit">저장</button>
        </div>
    </form>
</div>
</body>
</html>
