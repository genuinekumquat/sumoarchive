<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${keyword != null and !keyword.isBlank()} ? '「' + ${keyword} + '」 검색 결과 | 스모아카이브' : '검색 | 스모아카이브'">검색 결과 | 스모아카이브</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Noto+Serif+KR:wght@400;600;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sumi: #1a1a18;
            --sumi-soft: #56554e;
            --sumi-faint: #86857f;
            --washi: #f7f6f3;
            --washi-panel: #eceae4;
            --washi-line: rgba(26, 26, 24, 0.14);
            --shu: #a3272c;
            --shu-deep: #7c1d20;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: var(--washi);
            background-image:
                repeating-linear-gradient(90deg, rgba(26,26,24,0.022) 0px, rgba(26,26,24,0.022) 1px, transparent 1px, transparent 3px),
                repeating-linear-gradient(0deg, rgba(26,26,24,0.012) 0px, rgba(26,26,24,0.012) 1px, transparent 1px, transparent 5px);
            color: var(--sumi);
            font-family: 'Noto Serif KR', serif;
            line-height: 1.6;
            min-height: 100vh;
        }

        .page {
            max-width: 780px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        header {
            position: relative;
            border: 3px double var(--sumi);
            padding: 22px 28px 20px;
            margin-bottom: 30px;
        }

        .seal {
            position: absolute;
            top: -16px;
            right: 22px;
            width: 50px;
            height: 50px;
            background: var(--shu);
            color: var(--washi);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Yuji Syuku', serif;
            font-size: 22px;
            letter-spacing: -2px;
            transform: rotate(-4deg);
            box-shadow: 0 2px 3px rgba(0,0,0,0.3), inset 0 0 0 2px rgba(247,246,243,0.5);
        }

        .brand-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 16px;
        }

        .brand-jp {
            font-family: 'Yuji Syuku', serif;
            font-size: 26px;
            letter-spacing: 3px;
            color: var(--sumi);
            text-decoration: none;
        }

        .brand-kr {
            font-family: 'Noto Serif KR', serif;
            font-weight: 900;
            font-size: 15px;
            color: var(--sumi-soft);
        }

        .search-wrap { display: flex; gap: 10px; }

        .search-wrap input[type="text"] {
            flex: 1;
            border: 1px solid var(--sumi);
            background: rgba(255,255,255,0.55);
            padding: 11px 14px;
            font-family: 'Noto Serif KR', serif;
            font-size: 14px;
            color: var(--sumi);
        }

        .search-wrap input[type="text"]::placeholder { color: var(--sumi-faint); }

        .search-wrap input[type="text"]:focus {
            outline: 2px solid var(--shu);
            outline-offset: -1px;
        }

        .search-wrap button {
            border: 1px solid var(--sumi);
            background: var(--sumi);
            color: var(--washi);
            padding: 0 24px;
            font-family: 'Noto Serif KR', serif;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
        }
        .search-wrap button:hover { background: var(--shu-deep); border-color: var(--shu-deep); }

        /* ===== Result summary ===== */
        .result-summary {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--washi-line);
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 13px;
            color: var(--sumi-soft);
            letter-spacing: 1px;
        }
        .result-summary .kw {
            font-family: 'Noto Serif KR', serif;
            font-weight: 700;
            color: var(--sumi);
            font-size: 15px;
        }

        /* ===== Cards ===== */
        .card-list { display: flex; flex-direction: column; gap: 16px; }

        .card {
            position: relative;
            border: 1px solid var(--sumi);
            padding: 20px 22px;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid var(--washi-line);
            pointer-events: none;
        }

        .card:hover { border-color: var(--shu); }
        .card:hover .card-name-block .kr { color: var(--shu); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .card-name-block .kr {
            font-family: 'Noto Serif KR', serif;
            font-weight: 900;
            font-size: 22px;
            color: var(--sumi);
        }
        .card-name-block .jp {
            font-family: 'Yuji Syuku', serif;
            font-size: 14px;
            color: var(--sumi-faint);
            margin-left: 8px;
        }
        .card-name-block .real {
            display: block;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 12px;
            color: var(--sumi-soft);
            margin-top: 3px;
            letter-spacing: 1px;
        }

        .status-stamp {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 5px 12px;
            border: 2px solid var(--sumi);
            white-space: nowrap;
            transform: rotate(-3deg);
        }
        .status-active {
            background: var(--shu);
            border-color: var(--shu);
            color: var(--washi);
        }
        .status-retired {
            color: var(--sumi-faint);
            border-color: var(--washi-line);
        }
        .status-oyakata {
            color: var(--sumi-soft);
            border-color: var(--sumi-soft);
        }

        .card-info {
            font-family: 'Noto Serif KR', serif;
            font-size: 13.5px;
            color: var(--sumi-soft);
            display: flex;
            flex-wrap: wrap;
            gap: 4px 18px;
            padding-top: 10px;
            border-top: 1px dashed var(--washi-line);
        }
        .card-info .label {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 10.5px;
            color: var(--sumi-faint);
            letter-spacing: 1px;
            margin-right: 4px;
        }

        .card-oyakata-note {
            margin-top: 6px;
            font-size: 13px;
            color: var(--sumi-soft);
        }

        /* ===== Empty ===== */
        .empty-message {
            border: 1px dashed var(--washi-line);
            padding: 48px 20px;
            text-align: center;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 13px;
            color: var(--sumi-faint);
            letter-spacing: 1px;
        }

        /* ===== Pagination ===== */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 26px;
        }
        .pagination a, .pagination span {
            min-width: 36px;
            text-align: center;
            padding: 7px 11px;
            border: 1px solid var(--washi-line);
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 13px;
            text-decoration: none;
            color: var(--sumi-soft);
        }
        .pagination a:hover { border-color: var(--sumi); color: var(--sumi); }
        .pagination .current {
            background: var(--sumi);
            border-color: var(--sumi);
            color: var(--washi);
            font-weight: 700;
        }
        .pagination .disabled { color: var(--washi-line); }

        footer {
            text-align: center;
            margin-top: 30px;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--sumi-faint);
        }

        @media (max-width: 520px) {
            .card-name-block .kr { font-size: 18px; }
            .status-stamp { font-size: 10px; padding: 4px 8px; }
        }
    </style>
</head>
<body>
<div class="page">

    <header>
        <div class="seal">相撲</div>
        <div class="brand-row">
            <a class="brand-jp" th:href="@{/}">相撲archive</a>
            <span class="brand-kr">스모아카이브</span>
        </div>
        <div class="search-wrap">
            <form th:action="@{/search}" method="get" style="display: flex; gap: 10px; flex: 1;">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="시코나 또는 본명 검색">
                <button type="submit">검색</button>
            </form>
            <a th:href="@{/bookmark}" style="white-space: nowrap; align-self: center; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; color: var(--sumi-soft); text-decoration: none;">★ 즐겨찾기</a>
        </div>
    </header>

    <!-- 검색어가 없는 경우 -->
    <div class="empty-message" th:if="${keyword == null or keyword.isBlank()}">
        검색어를 입력해주세요.
    </div>

    <!-- 검색어가 있는 경우 -->
    <th:block th:if="${keyword != null and !keyword.isBlank()}">

        <div class="result-summary">
            <span><span class="kw" th:text="'「' + ${keyword} + '」'">「검색어」</span> 검색 결과</span>
            <span th:text="${result.totalElements} + '건'">0건</span>
        </div>

        <!-- 결과 0건 -->
        <div class="empty-message" th:if="${result.totalElements == 0}">
            검색 결과가 없습니다. 다른 검색어로 시도해보세요.
        </div>

        <!-- 결과 카드 -->
        <div class="card-list" th:if="${result.totalElements > 0}">
            <a class="card" th:each="item : ${result.content}"
               th:href="@{'/rikishi/' + ${item.rikishiId}}">
                <div class="card-header">
                    <div class="card-name-block">
                        <span class="kr" th:text="${item.shikonaKr}">시코나</span>
                        <span class="jp" th:if="${item.shikonaJp != null}" th:text="${item.shikonaJp}">四股名</span>
                        <span class="real" th:if="${item.name != null}" th:text="'본명 ' + ${item.name}">본명</span>
                    </div>
                    <span class="status-stamp"
                          th:classappend="${item.statusLabel == '현역'} ? 'status-active' : (${item.statusLabel == '오야카타'} ? 'status-oyakata' : 'status-retired')"
                          th:text="${item.statusLabel == '현역'} ? '現役' : (${item.statusLabel == '오야카타'} ? '親方' : '引退')">現役</span>
                </div>
                <div class="card-info">
                    <span><span class="label">소속</span><span th:text="${item.heyaName} ?: '무소속'">헤야</span></span>
                    <span><span class="label">최고위</span><span th:text="${item.highestRank} ?: '-'">계급</span></span>
                    <span><span class="label">활동시기</span><span th:text="${item.activePeriod}">기간</span></span>
                </div>
                <div class="card-oyakata-note" th:if="${item.oyakataNameKr != null}"
                     th:text="'오야카타명: ' + ${item.oyakataNameKr}">오야카타명</div>
            </a>
        </div>

        <!-- 페이지네이션 -->
        <div class="pagination" th:if="${result.totalPages > 1}">
            <a th:if="${!result.first}"
               th:href="@{/search(keyword=${keyword}, page=${result.number - 1})}">前</a>
            <span th:if="${result.first}" class="disabled">前</span>

            <th:block th:each="pageNum : ${#numbers.sequence(0, result.totalPages - 1)}">
                <span th:if="${pageNum == result.number}" class="current" th:text="${pageNum + 1}">1</span>
                <a th:unless="${pageNum == result.number}"
                   th:href="@{/search(keyword=${keyword}, page=${pageNum})}"
                   th:text="${pageNum + 1}">1</a>
            </th:block>

            <a th:if="${!result.last}"
               th:href="@{/search(keyword=${keyword}, page=${result.number + 1})}">次</a>
            <span th:if="${result.last}" class="disabled">次</span>
        </div>

    </th:block>

    <footer>SUMOARCHIVE — 同名でも別人。力士ごとに区別して表示。</footer>
</div>
</body>
</html>
