<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ===== <head> 공통: 검색 설명, 공유 미리보기(OG·Twitter), 파비콘 =====
     title: 공유 미리보기 제목 (브라우저 탭 <title>은 28편부터 사이트 이름으로 통일이라 별개)
     description: 검색 결과·미리보기에 나올 한두 문장
     indexable: false면 검색엔진 색인 제외 (검색 결과·즐겨찾기·에러 페이지)
     baseUrl/currentUrl은 SeoModelAdvice가 넣어준다. 에러 핸들러 화면에는 없을 수 있어 null이면 생략. -->
<th:block th:fragment="seo(title, description, indexable)">
    <meta name="description" th:content="${description}">
    <meta name="robots" content="noindex, follow" th:unless="${indexable}">
    <!-- 대표 주소·언어판 짝 (2026.10.19). 언어가 세션 기준이라 같은 경로가 한/일로 나와 중복으로 보이지 않게,
         한국어판 = 경로 그대로, 일본어판 = ?lang=ja 로 알려준다 (sitemap.xml과 같은 규칙). 색인 제외 페이지는 생략 -->
    <th:block th:if="${indexable and koUrl != null}">
        <link rel="canonical" th:href="${#locale.language == 'ja'} ? ${jaUrl} : ${koUrl}">
        <link rel="alternate" hreflang="ko" th:href="${koUrl}">
        <link rel="alternate" hreflang="ja" th:href="${jaUrl}">
        <link rel="alternate" hreflang="x-default" th:href="${koUrl}">
    </th:block>
    <!-- 네이버 서치어드바이저 소유 확인 (공개되는 값, 2026.10.12). Google은 Cloudflare DNS TXT로 확인 -->
    <meta name="naver-site-verification" content="857c80d83d15ceeeb2ee4dd8894ffb18fa41033c">

    <link rel="icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
    <meta property="og:site_name" th:content="#{site.title}">
    <meta property="og:type" content="website">
    <meta property="og:title" th:content="${title}">
    <meta property="og:description" th:content="${description}">
    <meta property="og:locale" th:content="${#locale.language == 'ja'} ? 'ja_JP' : 'ko_KR'">
    <meta property="og:url" th:if="${currentUrl != null}" th:content="${currentUrl}">
    <meta property="og:image" th:if="${baseUrl != null}" th:content="${baseUrl} + '/og-image.png'">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
</th:block>

<!-- ===== 방문 통계 beacon: 통계 대상 공개 페이지의 <head> 끝에 넣는다 (PageViewApiController, 2026.10.28).
     HTML만 받아가는 수집기는 스크립트를 실행하지 않으니 세지 않는다. 미리 렌더링(prerender)된 페이지는 실제로 열릴 때 보낸다.
     목록·IP는 보내지 않고 경로와 이전 페이지 주소만 보낸다. 실패해도 화면과 무관하므로 무시. -->
<script th:fragment="pageView">
(function () {
    function send() {
        try {
            var body = new URLSearchParams({ path: location.pathname, ref: document.referrer });
            if (!(navigator.sendBeacon && navigator.sendBeacon('/api/pv', body))) {
                fetch('/api/pv', { method: 'POST', body: body, keepalive: true }).catch(function () {});
            }
        } catch (e) {
            /* URLSearchParams·fetch 없는 브라우저 - 무시 */
        }
    }
    if (document.prerendering) {
        document.addEventListener('prerenderingchange', send, { once: true });
    } else {
        send();
    }
})();
</script>

<!-- ===== 언어 스위처: 헤더 안에 넣는다. 고른 언어는 세션에 저장된다(WebConfig의 LocaleChangeInterceptor).
     링크는 현재 주소 + ?lang=. 검색 결과 페이지는 검색어(keyword)가 사라지지 않게 같이 넘긴다.
     스타일(.lang-switch)은 각 페이지 CSS에 있다. -->
<div th:fragment="langSwitch" class="lang-switch">
    <a th:href="${keyword != null} ? @{''(keyword=${keyword},lang='ko')} : @{''(lang='ko')}"
       th:classappend="${#locale.language == 'ko'} ? 'active'" th:text="#{main.lang.ko}">한국어</a>
    <span class="sep">/</span>
    <a th:href="${keyword != null} ? @{''(keyword=${keyword},lang='ja')} : @{''(lang='ja')}"
       th:classappend="${#locale.language == 'ja'} ? 'active'" th:text="#{main.lang.ja}">日本語</a>
</div>

<!-- ===== 푸터 공통 문구: 데이터 출처 + 면책. 각 페이지 <footer> 안, 기존 한 줄 아래에 붙인다.
     페이지마다 footer에 letter-spacing이 크게 걸려 있어 여기서는 풀어준다. -->
<th:block th:fragment="footerNote">
    <p style="margin: 10px 0 0; letter-spacing: 0.3px; line-height: 1.7;">
        <span th:text="#{footer.source}">경기 기록 데이터</span>:
        <a href="https://sumo-api.com" target="_blank" rel="noopener" style="color: inherit;">sumo-api.com</a>
        <span th:text="#{footer.accuracy}">· 실제 기록과 다를 수 있습니다.</span><br>
        <span th:text="#{footer.disclaimer}">개인이 운영하는 팬 사이트이며 일본스모협회(日本相撲協会)와 관련이 없습니다.</span>
        · <a th:href="@{/updates}" th:text="#{footer.updates}" style="color: inherit;">업데이트 소식</a>
        · <a th:href="@{/privacy}" th:text="#{footer.privacy}" style="color: inherit;">개인정보 처리 안내</a>
        <!--/* 의견 페이지 안에서는 from을 또 붙이지 않는다 - from이 끝없이 중첩되는 주소를 크롤러가 따라가던 문제(2026.10.27) */-->
        · <a th:href="${#strings.startsWith(currentPath, '/feedback')} ? @{/feedback} : @{/feedback(from=${currentPath})}" rel="nofollow" th:text="#{footer.feedback}" style="color: inherit;">의견·오류 보내기</a>
    </p>
</th:block>

</body>
</html>
