<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title th:text="#{site.title}">스모아카이브</title>
    <th:block th:replace="~{fragments/common :: seo(#{site.title}, #{seo.bookmark.desc}, false)}"></th:block>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Noto+Serif+KR:wght@400;600;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sumi: #1a1a18;
            --sumi-soft: #56554e;
            --sumi-faint: #86857f;
            --washi: #f7f6f3;
            --washi-line: rgba(26, 26, 24, 0.14);
            --shu: #a3272c;
            --shu-deep: #7c1d20;
            --shu-faint: rgba(163, 39, 44, 0.10);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: var(--washi);
            background-image:
                    repeating-linear-gradient(90deg, rgba(26,26,24,0.022) 0px, rgba(26,26,24,0.022) 1px, transparent 1px, transparent 3px),
                    repeating-linear-gradient(0deg, rgba(26,26,24,0.012) 0px, rgba(26,26,24,0.012) 1px, transparent 1px, transparent 5px);
            color: var(--sumi);
            font-family: 'Noto Serif KR', serif;
            line-height: 1.6;
            min-height: 100vh;
        }
        .page { max-width: 760px; margin: 0 auto; padding: 40px 24px 80px; }
        a { color: inherit; }

        header { position: relative; border: 3px double var(--sumi); padding: 22px 28px 18px; margin-bottom: 26px; }
        .brand-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
        .brand-jp { font-family: 'Yuji Syuku', serif; font-size: 28px; letter-spacing: 3px; color: var(--sumi); text-decoration: none; }
        .brand-kr { font-family: 'Noto Serif KR', serif; font-weight: 900; font-size: 15px; letter-spacing: 1px; color: var(--sumi-soft); }
        .breadcrumb { margin-top: 10px; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; letter-spacing: 1px; color: var(--sumi-faint); }
        .breadcrumb a:hover { color: var(--shu); }
        /* 언어 스위처 (fragments/common :: langSwitch) */
        .lang-switch { margin-top: 10px; display: flex; align-items: center; gap: 6px; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 11px; letter-spacing: 1px; }
        .lang-switch a { color: var(--sumi-faint); text-decoration: none; }
        .lang-switch a:hover { color: var(--shu); }
        .lang-switch a.active { color: var(--sumi); font-weight: 700; }
        .lang-switch .sep { color: var(--washi-line); }

        h1 { font-size: 19px; letter-spacing: 1px; margin: 0 0 4px; }
        .hint { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; color: var(--sumi-faint); margin-bottom: 20px; }

        #bookmarkEmpty {
            border: 1px dashed var(--washi-line);
            padding: 48px 20px;
            text-align: center;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 13px;
            color: var(--sumi-faint);
            letter-spacing: 1px;
        }
        #bookmarkEmpty a { color: var(--shu); text-decoration: none; }

        .bm-card {
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid var(--washi-line);
            background: #fff;
            padding: 10px 14px;
            margin-bottom: 8px;
            cursor: grab;
        }
        .bm-card.sortable-ghost { opacity: 0.35; }
        .bm-card:hover { border-color: var(--shu); }

        .bm-handle { color: var(--sumi-faint); font-size: 16px; user-select: none; }

        .bm-body { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        .bm-link { display: flex; flex-direction: column; min-width: 0; text-decoration: none; }
        .bm-name { font-weight: 900; font-size: 15.5px; color: var(--sumi); }
        .bm-link:hover .bm-name { color: var(--shu); }
        .bm-sub { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 11.5px; color: var(--sumi-faint); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* 이번 바쇼: 계급·성적 / ○●□■ / 마지막 경기 */
        .bm-now { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12.5px; color: var(--sumi); margin-top: 3px; }
        .bm-now .rec { font-weight: 700; }
        .bm-marks { font-size: 13px; letter-spacing: 2px; color: var(--sumi); margin-top: 1px; word-break: break-all; }
        .bm-marks .w { color: var(--shu); }
        .bm-last { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; color: var(--sumi-soft); text-decoration: none; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bm-last:hover { color: var(--shu); }
        .bm-last .w { color: var(--shu); font-weight: 700; }
        .bm-next { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 12px; color: var(--sumi); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bm-next .rk { color: var(--sumi-faint); }
        .bm-summary {
            font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 13px; color: var(--sumi);
            border-left: 3px solid var(--shu); background: #fff; padding: 8px 12px; margin: 0 0 14px;
        }

        .bm-remove {
            flex-shrink: 0;
            border: 1px solid var(--washi-line);
            background: transparent;
            color: var(--sumi-soft);
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 12px;
            padding: 6px 10px;
            cursor: pointer;
        }
        .bm-remove:hover { border-color: var(--shu); color: var(--shu); }

        footer { text-align: center; margin-top: 30px; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 11px; letter-spacing: 2px; color: var(--sumi-faint); }
    </style>
</head>
<body>
<div class="page">

    <header>
        <div class="brand-row">
            <a class="brand-jp" th:href="@{/}">相撲archive</a>
            <span class="brand-kr" th:text="#{site.title}">스모아카이브</span>
        </div>
        <div class="breadcrumb"><a th:href="@{/}" th:text="#{common.nav.banzuke}">반즈케</a> &gt; <span th:text="#{bookmark.title}">즐겨찾기</span></div>
        <th:block th:replace="~{fragments/common :: langSwitch}"></th:block>
    </header>

    <h1 th:text="#{main.bookmark.link}">★ 즐겨찾기</h1>
    <p class="hint" th:text="#{bookmark.hint}">이 목록은 이 브라우저에만 저장돼요 (로그인 불필요). 드래그로 순서를 바꿀 수 있어요.</p>

    <div id="bookmarkEmpty" hidden>
        <span th:text="#{bookmark.empty}">아직 즐겨찾기한 리키시가 없습니다.</span><br>
        <span th:text="#{bookmark.empty.before}">리키시 프로필 페이지에서</span> <strong th:text="'★ ' + #{rikishi.bookmark}">★ 즐겨찾기</strong> <span th:text="#{bookmark.empty.after}">버튼을 눌러보세요.</span>
        <div style="margin-top: 10px;"><a th:href="@{/search}" th:text="#{bookmark.empty.search}">선수 검색하러 가기 →</a></div>
    </div>

    <p id="bashoSummary" class="bm-summary" hidden></p>
    <div id="bookmarkList"></div>

    <footer><span th:text="#{main.footer}">SUMOARCHIVE — 韓国語で見る大相撲情報アーカイブ</span><th:block th:replace="~{fragments/common :: footerNote}"></th:block></footer>
</div>

<script th:src="@{/js/bookmark.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script th:inline="javascript">
    (function () {
        // 화면 언어 (세션의 lang) - 카드 데이터의 한·일 필드와 문구를 여기에 맞춰 고른다
        var JA = /*[[${#locale.language == 'ja'}]]*/ false;
        var MSG = {
            unaffiliated: /*[[#{rikishi.value.unaffiliated}]]*/ '무소속',
            remove: /*[[#{bookmark.remove}]]*/ '제거',
            error: /*[[#{bookmark.error}]]*/ '즐겨찾기 목록을 불러오지 못했습니다.',
            inProgress: /*[[#{bookmark.basho.inProgress}]]*/ '{0} {1}일째',
            inProgressNoDay: /*[[#{bookmark.basho.inProgressNoDay}]]*/ '{0} 진행 중',
            finished: /*[[#{bookmark.basho.finished}]]*/ '{0} 종료',
            upcoming: /*[[#{bookmark.basho.upcoming}]]*/ '{0} · {1} 개막',
            date: /*[[#{bookmark.basho.date}]]*/ '{0}/{1}',
            today: /*[[#{bookmark.today}]]*/ '오늘 내 선수 {0}승 {1}패',
            entered: /*[[#{bookmark.entered}]]*/ '내 선수 {0}명 출전',
            record: /*[[#{bookmark.record}]]*/ '{0}승 {1}패',
            absent: /*[[#{bookmark.record.absent}]]*/ '{0}휴',
            day: /*[[#{bookmark.day}]]*/ '{0}일째',
            next: /*[[#{bookmark.next}]]*/ '다음 · {0} vs {1}',
            nextAnnounced: /*[[#{bookmark.nextAnnounced}]]*/ '{0} 대진 발표'
        };
        var listEl = document.getElementById('bookmarkList');
        var emptyEl = document.getElementById('bookmarkEmpty');
        var summaryEl = document.getElementById('bashoSummary');
        var MARK = { WIN: '○', LOSS: '●', FUSEN_WIN: '□', FUSEN_LOSS: '■' };
        var SEP = JA ? '・' : ' · ';

        function fmt(pattern) {
            var args = Array.prototype.slice.call(arguments, 1);
            return pattern.replace(/\{(\d)\}/g, function (m, i) { return args[i]; });
        }

        // 계급 · 바쇼 이름 성적 (개막 전이면 성적 없이)
        function nowLine(cur, basho) {
            var rank = JA ? cur.rankJp : cur.rankKr;
            var name = basho ? (JA ? basho.nameJp : basho.nameKr) : '';
            if (basho && basho.status === 'UPCOMING') return esc(rank) + SEP + esc(name);
            var rec = fmt(MSG.record, cur.wins, cur.losses) + (cur.absences > 0 ? (JA ? '' : ' ') + fmt(MSG.absent, cur.absences) : '');
            return esc(rank) + SEP + esc(name) + ' <span class="rec">' + esc(rec) + '</span>';
        }

        function marksHtml(marks) {
            return marks.map(function (m) {
                var s = MARK[m] || '';
                return m.indexOf('WIN') >= 0 ? '<span class="w">' + s + '</span>' : s;
            }).join('');
        }

        function lastBoutHtml(b) {
            var opp = JA ? b.opponentJp : b.opponentKr;
            var kim = JA ? b.kimariteJp : b.kimariteKr;
            // "[" 바로 뒤에 "("를 쓰면 Thymeleaf 인라인 표현식으로 읽히므로 키를 먼저 만든다
            var key = (b.fusen ? 'FUSEN_' : '') + (b.win ? 'WIN' : 'LOSS');
            var mark = MARK[key];
            return '<a class="bm-last" href="/torikumi/' + b.torikumiId + '">' + esc(fmt(MSG.day, b.day)) + ' ' +
                (b.win ? '<span class="w">' + mark + '</span>' : mark) + ' ' + esc(opp) + (kim ? SEP + esc(kim) : '') + ' →</a>';
        }

        // 발표된 다음 경기 (예정 대진, 링크 없음)
        function nextBoutHtml(n) {
            var rank = JA ? n.opponentRankJp : n.opponentRankKr;
            var opp = (rank ? '<span class="rk">' + esc(rank) + '</span> ' : '') + esc(JA ? n.opponentJp : n.opponentKr);
            return '<span class="bm-next">' + fmt(esc(MSG.next), esc(fmt(MSG.day, n.day)), opp) + '</span>';
        }

        // 맨 위 한 줄: 진행 중이면 그날(적재된 마지막 일차) 내 선수 승패, 끝났거나 개막 전이면 출전 인원
        function renderSummary(basho, cards) {
            if (!basho) return;
            var label = JA ? basho.labelJp : basho.labelKr;
            var entered = cards.filter(function (c) { return c.current; });
            var head;
            if (basho.status === 'UPCOMING') {
                var d = basho.startDate ? basho.startDate.split('-') : null;
                head = d ? fmt(MSG.upcoming, label, fmt(MSG.date, Number(d[1]), Number(d[2]))) : label;
            } else if (basho.status === 'FINISHED') {
                head = fmt(MSG.finished, label);
            } else {
                head = basho.lastDay ? fmt(MSG.inProgress, label, basho.lastDay) : fmt(MSG.inProgressNoDay, label);
            }
            var tail = '';
            if (basho.status === 'IN_PROGRESS' && basho.lastDay) {
                var w = 0, l = 0;
                entered.forEach(function (c) {
                    var b = c.current.lastBout;
                    if (b && b.day === basho.lastDay) { if (b.win) w++; else l++; }
                });
                if (w + l > 0) tail = fmt(MSG.today, w, l);
            }
            if (!tail && entered.length > 0) tail = fmt(MSG.entered, entered.length);
            if (basho.nextDay && basho.status !== 'FINISHED') {
                tail = (tail ? tail + SEP : '') + fmt(MSG.nextAnnounced, fmt(MSG.day, basho.nextDay));
            }
            summaryEl.textContent = head + (tail ? SEP + tail : '');
            summaryEl.hidden = false;
        }

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function showEmptyIfNeeded() {
            if (listEl.children.length === 0) emptyEl.hidden = false;
        }

        function render(orderIds, cards, basho) {
            var byId = {};
            cards.forEach(function (c) { byId[c.rikishiId] = c; });

            listEl.innerHTML = '';
            orderIds.forEach(function (id) {
                var c = byId[id];
                if (!c) return; // 삭제된 리키시 등 더 이상 존재하지 않으면 조용히 스킵

                var name = JA && c.shikonaJp ? c.shikonaJp : c.shikonaKr;
                var heya = JA ? c.heyaNameJp : c.heyaName;
                var rank = JA ? c.highestRankJp : c.highestRank;
                var period = JA ? c.activePeriodJp : c.activePeriod;
                var status = JA ? c.statusLabelJp : c.statusLabel;

                var card = document.createElement('div');
                card.className = 'bm-card';
                card.dataset.rikishiId = id;
                var cur = c.current;
                // 경기 상세 링크(.bm-last)가 프로필 링크 안에 들어가면 안 돼서 프로필 링크를 둘로 나눈다
                card.innerHTML =
                    '<span class="bm-handle">⠿</span>' +
                    '<span class="bm-body">' +
                        '<a class="bm-link" href="/rikishi/' + id + '">' +
                            '<span class="bm-name">' + esc(name) + '</span>' +
                            (cur ? '<span class="bm-now">' + nowLine(cur, basho) + '</span>' : '') +
                            (cur && cur.marks.length ? '<span class="bm-marks">' + marksHtml(cur.marks) + '</span>' : '') +
                        '</a>' +
                        (cur && cur.lastBout ? lastBoutHtml(cur.lastBout) : '') +
                        (cur && cur.nextBout ? nextBoutHtml(cur.nextBout) : '') +
                        '<a class="bm-link" href="/rikishi/' + id + '">' +
                            '<span class="bm-sub">' + esc(heya || MSG.unaffiliated) + ' · ' + esc(rank || '-') + '</span>' +
                            '<span class="bm-sub">' + esc(period) + ' · ' + esc(status) + '</span>' +
                        '</a>' +
                    '</span>' +
                    '<button type="button" class="bm-remove" data-id="' + id + '">' + esc(MSG.remove) + '</button>';
                listEl.appendChild(card);
            });

            listEl.querySelectorAll('.bm-remove').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    window.SumoBookmark.toggle(btn.dataset.id);
                    btn.closest('.bm-card').remove();
                    showEmptyIfNeeded();
                });
            });

            if (window.Sortable) {
                Sortable.create(listEl, {
                    handle: '.bm-handle',
                    animation: 150,
                    onEnd: function () {
                        var newOrder = Array.prototype.map.call(listEl.children, function (el) {
                            return Number(el.dataset.rikishiId);
                        });
                        window.SumoBookmark.setIds(newOrder);
                    }
                });
            }
        }

        var ids = window.SumoBookmark.getIds();
        if (ids.length === 0) {
            emptyEl.hidden = false;
        } else {
            fetch('/api/rikishiEntity?ids=' + ids.join(','))
                .then(function (res) { return res.json(); })
                .then(function (page) {
                    render(ids, page.cards, page.basho);
                    renderSummary(page.basho, page.cards);
                    showEmptyIfNeeded();
                })
                .catch(function () {
                    listEl.innerHTML = '<p class="hint">' + esc(MSG.error) + '</p>';
                });
        }
    })();
</script>
</body>
</html>
