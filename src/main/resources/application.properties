spring.application.name=sumoarchive

# 실제 DB/관리자 비밀번호는 application-local.properties(git 제외)에 둡니다.
# 처음 받는 분은 application-local.properties.example을 복사해서 값을 채워주세요.
spring.config.import=optional:classpath:application-local.properties

# =====================================================
# 1. Database Connection (MySQL)
# =====================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# localhost:3306 뒤에 사용하실 스키마(데이터베이스) 이름을 적어주세요.
spring.datasource.url=jdbc:mysql://localhost:3306/sumo?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
# spring.datasource.username / spring.datasource.password -> application-local.properties

# =====================================================
# 2. JPA & Hibernate Settings
# =====================================================
# ddl-auto 옵션:
# - update: 엔티티 클래스 분석해서 DB에 없는 테이블/컬럼만 추가 (개발 중 추천)
# - none: DB 테이블 구조를 수동으로 직접 관리할 때 사용 (확정된 DDL이 있을 때 추천)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# 3. Application Admin Properties (MVP 간이 어드민용)
# =====================================================
# admin.username / admin.password -> application-local.properties

# =====================================================
# 4. External Data Source (sumo-api.com)
# =====================================================
sumo-api.base-url=https://sumo-api.com
# 옛 더미데이터 시더. sumo-api 임포트로 전환한 뒤로는 꺼둠 (true로 켜면 DataSeeder 실행)
app.seed-demo=false