spring.application.name=sumoarchive

# 기본 활성 프로필: 별도 프로필이 지정되지 않으면 local(개발용)로 동작합니다.
# 운영 배포 시에는 --spring.profiles.active=prod 또는 SPRING_PROFILES_ACTIVE=prod 환경변수를 지정하세요.
spring.profiles.default=local

# 로컬 개발용 민감정보(DB/관리자 비밀번호)는 application-local.properties(git 제외)에 둡니다.
# 처음 프로젝트를 클론받은 경우 application-local.properties.example을 복사하여 생성하세요.
spring.config.import=optional:classpath:application-local.properties

# =====================================================
# 1. Database Connection (MySQL)
# =====================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# localhost:3306 뒤에 사용하실 스키마(데이터베이스) 이름을 적어주세요.
spring.datasource.url=jdbc:mysql://localhost:3306/sumo?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
# spring.datasource.username / spring.datasource.password -> application-local.properties

# =====================================================
# 2. JPA & Hibernate Settings
# =====================================================
# 스키마는 Flyway(src/main/resources/db/migration)가 관리한다. Hibernate는 엔티티와 테이블이 맞는지 검사만 한다.
# 엔티티에 컬럼을 추가/변경하면 V2__설명.sql 같은 마이그레이션 파일을 같이 만들어야 앱이 뜬다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway: 빈 DB면 V1부터 실행해 테이블을 만들고, 이미 테이블이 있는 DB(Flyway 도입 전 로컬 DB 등)는
# 처음 한 번 "V1까지 적용됨"으로 표시(baseline)만 하고 V2부터 실행한다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# =====================================================
# 3. Security & Session (쿠키 보안: XSS/CSRF 방어)
# =====================================================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# 세션은 쿠키로만. 기본값이면 쿠키 없는 방문자(검색엔진 크롤러 등)에게 링크마다 ;jsessionid=…를 붙여
# 세션 ID가 주소에 노출되고 검색 결과에도 그런 주소가 색인될 수 있다.
server.servlet.session.tracking-modes=cookie
# 프록시(Nginx) 뒤의 실제 클라이언트 IP·https 여부: 직전 연결이 사설망/localhost(신뢰 프록시)일 때만
# X-Forwarded-For/Proto를 반영한다 (ClientIpResolver 참고). Cloudflare 등 외부 프록시를 앞에 두면
# server.tomcat.remoteip.trusted-proxies에 그 IP 대역을 추가해야 한다.
server.forward-headers-strategy=native

# =====================================================
# 4. Application Admin Properties (MVP 간이 어드민용)
# =====================================================
# admin.username / admin.password -> application-local.properties

# =====================================================
# 4. External Data Source (sumo-api.com)
# =====================================================
sumo-api.base-url=https://sumo-api.com
# 옛 더미데이터 시더. sumo-api 임포트로 전환한 뒤로는 꺼둠 (true로 켜면 DataSeeder 실행)
app.seed-demo=false

# =====================================================
# 5. Localization (i18n) - 메인 페이지 시범 적용 (WebConfig의 LocaleResolver/Interceptor 참고)
# =====================================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# =====================================================
# 6. Health Check (Actuator)
# =====================================================
# /actuator/health 하나만 연다. docker compose healthcheck와 외부 업타임 모니터가 사용한다.
# DB 연결까지 확인하므로 MySQL이 끊기면 DOWN(503)이 된다. 세부 정보(디스크·DB 종류 등)는 노출하지 않는다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
