services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sumoarchive-app
    restart: unless-stopped
    ports:
      # Nginx(같은 서버)만 접근하도록 localhost에만 연다. 0.0.0.0으로 열면 Nginx·HTTPS를 거치지 않는 직접 접속이 가능해진다.
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/sumo?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-sumo}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?.env에 SPRING_DATASOURCE_PASSWORD를 설정하세요}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-torikumiAdmin}
      # 비밀번호는 모두 기본값 없음: .env에 없으면 compose가 시작을 거부한다 (공개 저장소에 적힌 비밀번호로 운영되는 것 방지)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?.env에 ADMIN_PASSWORD를 설정하세요}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: sumoarchive-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_DATABASE=sumo
      - MYSQL_USER=${SPRING_DATASOURCE_USERNAME:-sumo}
      - MYSQL_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?.env에 SPRING_DATASOURCE_PASSWORD를 설정하세요}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?.env에 MYSQL_ROOT_PASSWORD를 설정하세요}
    volumes:
      - sumo_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sumo_db_data:
