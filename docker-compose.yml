services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sumoarchive-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/sumo?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-sumo}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-sumo_password}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-torikumiAdmin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-torikumiPass123!}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: sumoarchive-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_DATABASE=sumo
      - MYSQL_USER=${SPRING_DATASOURCE_USERNAME:-sumo}
      - MYSQL_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-sumo_password}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - sumo_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sumo_db_data:
