# docker logs(콘솔 출력) 크기 제한. 기본값은 무제한이라 오래 운영하면 디스크를 채운다.
# 컨테이너당 10MB x 5개까지만 남긴다.
x-logging: &docker-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sumoarchive-app
    restart: unless-stopped
    ports:
      # Nginx(같은 서버)만 접근하도록 localhost에만 연다. 0.0.0.0으로 열면 Nginx·HTTPS를 거치지 않는 직접 접속이 가능해진다.
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/sumo?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-sumo}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?.env에 SPRING_DATASOURCE_PASSWORD를 설정하세요}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-torikumiAdmin}
      # 비밀번호는 모두 기본값 없음: .env에 없으면 compose가 시작을 거부한다 (공개 저장소에 적힌 비밀번호로 운영되는 것 방지)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?.env에 ADMIN_PASSWORD를 설정하세요}
    depends_on:
      db:
        condition: service_healthy
    # Actuator health가 UP인지 확인 (DB 연결 포함). docker ps에 healthy/unhealthy로 표시된다.
    # 기동(Flyway 포함)에 시간이 걸리므로 start_period 동안의 실패는 세지 않는다.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      # 앱 로그 파일(/app/logs) - 컨테이너를 다시 만들어도 남는다. 보관 기간·용량은 application-prod.properties
      - sumo_app_logs:/app/logs
    logging: *docker-logging

  db:
    image: mysql:8.0
    container_name: sumoarchive-db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_DATABASE=sumo
      - MYSQL_USER=${SPRING_DATASOURCE_USERNAME:-sumo}
      - MYSQL_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?.env에 SPRING_DATASOURCE_PASSWORD를 설정하세요}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?.env에 MYSQL_ROOT_PASSWORD를 설정하세요}
    volumes:
      - sumo_db_data:/var/lib/mysql
    logging: *docker-logging
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sumo_db_data:
  sumo_app_logs:
